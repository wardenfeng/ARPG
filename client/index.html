<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARPG Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #000;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1000;
    }
    #app > * {
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
